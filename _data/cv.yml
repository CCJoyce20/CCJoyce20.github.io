          - "Humanoid Surgery (co-author, Nature 2026): tool-mount system design and mechanical setup for in vivo porcine surgeries."
          - "Autonomous Catheter Navigation (ARPA-H & DARPA): PPO catheter steering in GPU-physics simulation; three catheter examples for the open-source Newton engine."
